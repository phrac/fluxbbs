# One board in a container, built from this checkout. From the repo:
#
#     docker compose -f deploy/docker-compose.yml up -d --build
#
# BOARD is the board directory (config, data, files, own screens); the
# default is `disflux` beside the checkout (/opt/fluxbbs/disflux for
# /opt/fluxbbs/src). Set it, and COMPOSE_PROJECT_NAME, in deploy/.env
# (git-ignored). The image's stock files are at /srv/inq/iniquity, so a
# board's `../inq/iniquity/...` paths resolve inside the container. It
# is mounted writable and the server runs as
# BBS_UID:BBS_GID (default 1000:1000), so match the directory's owner.
# SSH is on 2222 and telnet on 23 of the host, and binkp (FTN mail, if
# [ftn] listen is set) on 24554. The status feed ([web],
# listening on 0.0.0.0:8099 inside the container) is published on the
# host's loopback only, for a web server there to pass through.
# FEATURES picks the optional components built in (docs/BUILDING.md);
# the default is all of them, as disflux, the flagship board, runs.
services:
  fluxbbs:
    build:
      context: ..
      args:
        FEATURES: ${FEATURES:-full}
    image: fluxbbs
    container_name: fluxbbs
    restart: unless-stopped
    user: "${BBS_UID:-1000}:${BBS_GID:-1000}"
    working_dir: /srv/board
    volumes:
      - ${BOARD:-../../disflux}:/srv/board
    ports:
      - "2222:2222"
      - "23:2323"
      - "24554:24554"
      - "127.0.0.1:8099:8099"
    environment:
      # e.g. RUST_LOG=info,russh=trace to watch the SSH protocol.
      RUST_LOG: "${RUST_LOG:-info,russh=warn}"
      # The SMTP password for [email], from the host's environment or a
      # .env file here; never in the board's TOML.
      FLUXBBS_SMTP_PASSWORD: "${FLUXBBS_SMTP_PASSWORD:-}"
    stop_grace_period: 15s
