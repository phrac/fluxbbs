# A release: push a tag (git tag -a v0.2.0 -m "what's new"; git push origin
# v0.2.0) and this tests the board, builds static Linux binaries for x86_64
# and ARM64 (Raspberry Pi), packs each with the stock files, publishes them
# as a GitHub release with the tag's message as its notes, and pushes a
# multi-arch image to ghcr.io/phrac/fluxbbs. Everything is built with
# every optional component (`full`), as disflux runs.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to (re)build, e.g. v0.2.0"
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The tag matches the version (crates/fluxbbs/Cargo.toml)
        run: |
          want=$(grep -m1 '^version' crates/fluxbbs/Cargo.toml | cut -d'"' -f2)
          [ "${TAG#v}" = "$want" ] || { echo "tag $TAG but the crate says $want: bump it first"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test (core and full)
        run: |
          cargo test --locked
          cargo test --locked --features full
      - name: Clippy (core and full)
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features full -- -D warnings

  build:
    needs: test
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-${{ matrix.arch }}
      - name: musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (static, every component)
        run: cargo build --release --locked -p fluxbbs --features full --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Pack with the stock files
        run: |
          name=fluxbbs-${TAG}-linux-${{ matrix.arch }}
          mkdir -p dist/$name
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/fluxbbs dist/$name/
          strip dist/$name/fluxbbs
          cp -r fluxbbs.toml msgareas.toml fileareas.toml text menus themes scripts classic art docs README.md LICENSE dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name
          (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
      - name: Check it runs
        run: |
          dist/fluxbbs-${TAG}-linux-${{ matrix.arch }}/fluxbbs --version
          file dist/fluxbbs-${TAG}-linux-${{ matrix.arch }}/fluxbbs
      - uses: actions/upload-artifact@v4
        with:
          name: fluxbbs-${{ matrix.arch }}
          path: dist/*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notes, from the tag's message (else the commits since the last tag)
        run: |
          git fetch --force --tags
          notes=$(git tag -l --format='%(contents)' "$TAG")
          if [ -z "$(echo "$notes" | tr -d '[:space:]')" ]; then
            prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            notes=$(git log --format='- %s' ${prev:+$prev..}"$TAG")
          fi
          {
            echo "$notes"
            echo
            echo "**Install:** unpack the archive for your machine and run \`./fluxbbs\` in its folder (SSH on 2222, telnet on 2323). The first start makes the SysOp: log in as \`SysOp\` / \`SYSOP\`. Static Linux binaries, every optional component included; showing PDFs also needs \`poppler-utils\`, Python scripts \`python3\`."
            echo
            echo "**Docker:** \`docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}\`"
          } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "flux/bbs $TAG" --notes-file notes.md --verify-tag
          fi

  image:
    needs: test
    strategy:
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: FEATURES=full
          platforms: linux/${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  manifest:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: One tag for both machines
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          version=${TAG#v}
          docker buildx imagetools create -t $image:$version -t $image:latest \
            $image:$TAG-amd64 $image:$TAG-arm64
