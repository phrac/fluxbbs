[package]
name = "iniquity"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
chrono = "0.4.45"
iniquity-dos = { path = "../iniquity-dos" }
flate2 = "1.1.10"
iniquity-legacy = { version = "0.1.0", path = "../iniquity-legacy" }
iniquity-term = { version = "0.1.0", path = "../iniquity-term" }
libc = "0.2.191"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
russh = "0.64.1"
serde = { version = "1.0.229", features = ["derive"] }
tar = "0.4.46"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
serde_json = "1.0.154"
toml_edit = { version = "0.25.17", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
zmodem2 = "0.7.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "jpeg"] }
futures-util = "0.3.34"
md-5 = "0.10"
hmac = "0.12"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
