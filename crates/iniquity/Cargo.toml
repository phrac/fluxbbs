[package]
name = "iniquity"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
chrono = "0.4.45"
iniquity-legacy = { version = "0.1.0", path = "../iniquity-legacy" }
iniquity-term = { version = "0.1.0", path = "../iniquity-term" }
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
russh = "0.64.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
toml_edit = { version = "0.25.17", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
zmodem2 = "0.7.3"
