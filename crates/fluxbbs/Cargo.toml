[package]
name = "fluxbbs"
version = "1.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
chrono = "0.4.45"
chrono-tz = "0.10.4"
fluxbbs-dos = { path = "../fluxbbs-dos", optional = true }
flate2 = "1.1.10"
iniquity-legacy = { version = "0.1.0", path = "../iniquity-legacy" }
fluxbbs-term = { version = "0.1.0", path = "../fluxbbs-term" }
libc = "0.2.191"
rand = "0.10.3"
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
russh = "0.64.1"
serde = { version = "1.0.229", features = ["derive"] }
tar = "0.4.46"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
serde_json = "1.0.154"
toml_edit = { version = "0.25.17", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate", "legacy-zip"] }
zmodem2 = "0.7.3"
image = { version = "0.25.10", default-features = false, features = ["gif", "png", "jpeg"] }
futures-util = "0.3.34"
md-5 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26.6", default-features = false, optional = true }
webpki-roots = { version = "1.0.11", optional = true }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"], optional = true }

# Optional components (docs/BUILDING.md). A plain `cargo build` is the
# core board; `--features full` is everything, as disflux, the flagship
# board, runs. A part left out answers its commands as one switched off
# in *C Features, and its settings still load.
[features]
default = []
full = ["doors", "effects", "screensavers", "games", "ai", "ftn", "meshcore", "mrc", "pdf", "python", "textfiles", "email", "weather"]
# DOS doors in the built-in DOS machine, external doors, and BBSLink.
doors = ["dep:fluxbbs-dos", "dep:reqwest", "dep:md-5"]
# Menus and screens that animate while they wait (.FX effects, glints),
# and the TV switching off at logoff.
effects = []
# The screen savers (digital rain, starfield, fire) and their font picker.
screensavers = ["effects"]
# The games of the board's own.
games = ["casino", "carrierlost", "tarot"]
casino = []
carrierlost = []
# The tarot's readings come from the AI, so it brings `ai`.
tarot = ["ai"]
# AI chat, the AI on the message boards, and its memory of callers.
ai = ["dep:reqwest"]
# FidoNet-style echomail: packets, tossing, binkp.
ftn = ["dep:md-5", "dep:hmac"]
# The MeshCore radio bridge.
meshcore = []
# MRC (Multi Relay Chat), live chat between BBSes, over TLS.
mrc = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
# Showing PDFs (needs Poppler on the host).
pdf = []
# Python scripts on menus (-X) and in strings (%!): the fluxbbs module.
python = []
# Importing the textfiles.com archive (`fluxbbs textfiles`).
textfiles = ["dep:reqwest"]
# Callers' email addresses, confirmed by a code sent over SMTP.
email = ["dep:lettre"]
# The weather (`WX`), from Open-Meteo, in pixels; the AI reads it if `ai` is built too.
weather = ["dep:reqwest"]
