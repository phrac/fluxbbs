# Iniquity BBS configuration, imported from the stock 1.00a26r5 install.
# Paths are relative to this file.

[bbs]
name = "Iniquity"
location = "Somewhere, ??"
phone = "(000)000-0000"
sysop_alias = "SysOp"
sysop_name = "System Operator"
max_nodes = 16
inactivity_seconds = 180

[ssh]
listen = "0.0.0.0:2222"
host_key_dir = "data"
legacy_algorithms = true

[paths]
text = "text"
menus = "menus"
data = "data"
strings = "strings.toml"
msgareas = "msgareas.toml"
fileareas = "fileareas.toml"
temp = "data/temp"

[terminal]
charset = "auto"
cp437_terms = [
    "syncterm",
    "ansi-bbs",
    "ansi",
    "pc-ansi",
    "pcansi",
    "scoansi",
    "netrunner",
]

[acs]
sysop = "s255"
cosysop = "s250"

[logon]
matrix = true
ask_apply = true
tries = 5
system_password = "SYSTEM"
system_password_acs = "s250"
start_menu = "STARTUP"
real_names = false
time_per_call = false
last_callers = 10

[newuser]
password = ""
verify = true
alias_format = 2
page_length = 24
ask_page_length = true
hot_keys = true
ask_hot_keys = true
expert = false
ask_expert = true
pause = true
ask_pause = true
quote = true
ask_quote = true
yes_no_bars = true
ask_yes_no_bars = true

[prompts]
yes = "|U5[|U6Y|U5/|U4n|U5] |U6"
no = "|U5[|U4y|U5/|U6N|U5] |U6"
yes_word = "Yes"
no_word = "No"
yes_bar = "|U8 Yes |U7 No "
no_bar = "|U7 Yes |U8 No |U1"
password_echo = "■"
remove_pause = true

[messages]
acs_post_email = "s25"
acs_anonymous = "s50"
acs_anon_automsg = "s50"
acs_autosig = "s25"
abort_mandatory_ok = false
ask_private = true
ask_private_reply = true
ask_post_after_read = true
ask_delete_replied = true
ask_delete_all_read = true
ask_auto_quote = true
default_quote_lines = true
max_quote_lines = 11
mandatory_all_confs = true
compress_area_numbers = true
ansi_quote = "(ansi codes detected; line not displayed)"

[files]
use_file_points = false
kb_per_point = 15
upload_points_percent = 175
use_daily_limit = true
use_daily_kb_limit = true
use_ratio = false
use_kb_ratio = false
auto_validate = true
allow_blind_upload = true
upload_dupe_check = 4
import_descriptions = true
description_files = [
    "FILE_ID.DIZ",
    "DESC.SDI",
]
no_description = "No description"
wrap_descriptions = true
advance_bar_on_flag = true
max_upload_bytes = 104857600
transfer_cps = 500000

[[colors]]
fore = 12
back = 0
blink = false

[[colors]]
fore = 7
back = 0
blink = false

