# The board's autosignature menu: a lightbar with hot keys over AUTOSIG.ANS. Made by
# art/mainmenu-gen.py autosig (from the stock menu); change that, not this.
title = "AutoSignature Menu"
prompt_name = "autosig"
help_file = "AUTOSIG"
fallback = "MAIN"
generic_columns = 3
pause_before = true
global = true
upper_input = true
type = "lightbar"

