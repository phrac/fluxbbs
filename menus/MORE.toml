on = "\u001b[0;30;45m (\u001b[0;1;37;45m<\u001b[0;30;45m) \u001b[0;1;37;45mback                           \u001b[0m"
off = " \u001b[0;1;30m(\u001b[0;1;35m<\u001b[0;1;30m) \u001b[38;2;255;255;255mb\u001b[38;2;255;142;255ma\u001b[38;2;227;57;227mc\u001b[38;2;170;0;170mk                           \u001b[0m"
