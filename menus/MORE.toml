command = "NV"
param = "Show"
acs = "s50"
desc = "New user voting"
help = "Vote on new users you have not yet voted on (if enabled)"
on = "\u001b[0;30;45m (\u001b[0;1;37;45m%\u001b[0;30;45m) \u001b[0;1;37;45mnew user voting                \u001b[0m"
off = " \u001b[0;1;30m(\u001b[0;1;35m%\u001b[0;1;30m) \u001b[38;2;255;255;255mn\u001b[38;2;255;231;255me\u001b[38;2;255;206;255mw \u001b[38;2;255;158;255mu\u001b[38;2;255;134;255ms\u001b[38;2;255;109;255me\u001b[38;2;255;85;255mr \u001b[38;2;231;61;231mv\u001b[38;2;219;49;219mo\u001b[38;2;206;36;206mt\u001b[38;2;194;24;194mi\u001b[38;2;182;12;182mn\u001b[38;2;170;0;170mg                \u001b[0m"

[[command]]
