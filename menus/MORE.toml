# The board's more: a lightbar with hot keys over MORE.ANS. Made by
# art/mainmenu-gen.py more (from the stock menu); change that, not this.
title = "More"
prompt_name = "More"
help_file = "MORE"
fallback = "MAIN"
generic_columns = 3
pause_before = true
global = true
type = "lightbar"

[[command]]
keys = "Q"
command = "-/"
param = "QWKMAIL"
acs = "s50"
desc = "QWKmail menu"
help = "Goto the offline mail menu"
on = "\u001b[0;30;45m (\u001b[0;1;37;45mq\u001b[0;30;45m) \u001b[0;1;37;45mqwk mail                       \u001b[0m"
off = " \u001b[0;1;30m(\u001b[0;1;35mq\u001b[0;1;30m) \u001b[38;2;255;255;255mq\u001b[38;2;255;206;255mw\u001b[38;2;255;158;255mk \u001b[38;2;243;73;243mm\u001b[38;2;219;49;219ma\u001b[38;2;194;24;194mi\u001b[38;2;170;0;170ml                       \u001b[0m"

[[command]]
keys = "T"
command = "-/"
param = "timebank"
acs = "s50"
desc = "Time Bank"
help = "None"
on = "\u001b[0;30;45m (\u001b[0;1;37;45mt\u001b[0;30;45m) \u001b[0;1;37;45mtime bank                      \u001b[0m"
