acs = "s25"
desc = "AutoMsg menu"
help = "The automessage: show it, write one, reply to its author"
on = "\u001b[0;30;45m (\u001b[0;1;37;45m!\u001b[0;30;45m) \u001b[0;1;37;45mautomsg                        \u001b[0m"
