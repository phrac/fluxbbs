# The board's automessage menu: a lightbar with hot keys over AUTOMSG.ANS. Made by
# art/mainmenu-gen.py automsg (from the stock menu); change that, not this.
title = "AutoMessage Menu"
prompt_name = "automessage"
help_file = "AUTOMSG"
acs = "s25"
fallback = "MAIN"
generic_columns = 3
pause_before = true
global = true
upper_input = true
type = "lightbar"

