# The board's online games: a lightbar with hot keys over DOOR.ANS. Made by
# art/mainmenu-gen.py door (from the stock menu); change that, not this.
title = "Online Games menu"
prompt_name = "online games"
help_file = "DOOR"
acs = "s50"
