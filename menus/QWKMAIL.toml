# The board's offline mail menu: a lightbar with hot keys over QWKMAIL.ANS. Made by
# art/mainmenu-gen.py qwkmail (from the stock menu); change that, not this.
title = "Offline Mail Menu"
prompt_name = "offline mail"
help_file = "QWKMAIL"
fallback = "MAIN"
generic_columns = 3
pause_before = true
global = true
upper_input = true
type = "lightbar"

[[command]]
keys = "D"
command = "QD"
acs = "s25"
desc = "Download QWK packet"
help = "Generate/download an offline mail [qwk] packet"
on = "\u001b[0;30;41m (\u001b[0;1;37;41md\u001b[0;30;41m) \u001b[0;1;37;41mdownload qwk packet            \u001b[0m"
off = " \u001b[0;1;30m(\u001b[0;1;31md\u001b[0;1;30m) \u001b[38;2;255;255;255md\u001b[38;2;255;236;236mo\u001b[38;2;255;217;217mw\u001b[38;2;255;198;198mn\u001b[38;2;255;179;179ml\u001b[38;2;255;161;161mo\u001b[38;2;255;142;142ma\u001b[38;2;255;123;123md \u001b[38;2;255;85;85mq\u001b[38;2;246;76;76mw\u001b[38;2;236;66;66mk \u001b[38;2;217;47;47mp\u001b[38;2;208;38;38ma\u001b[38;2;198;28;28mc\u001b[38;2;189;19;19mk\u001b[38;2;179;9;9me\u001b[38;2;170;0;0mt            \u001b[0m"

