# Iniquity BBS configuration, imported from the stock 1.00a26r5 install.
# Paths are relative to this file.

[bbs]
name = "Iniquity"
location = "Somewhere, ??"
phone = "(000)000-0000"
sysop_alias = "SysOp"
sysop_name = "System Operator"
max_nodes = 16
inactivity_seconds = 180
# The zone the board keeps time in (an IANA name: "America/Chicago"); blank
# for the host's clock. Callers can pick their own in user configuration.
time_zone = ""

[ssh]
listen = "0.0.0.0:2222"
host_key_dir = "data"
legacy_algorithms = true

[paths]
text = "text"
menus = "menus"
data = "data"
strings = "strings.toml"
msgareas = "msgareas.toml"
fileareas = "fileareas.toml"
temp = "data/temp"

[terminal]
charset = "auto"
cp437_terms = [
    "syncterm",
    "ansi-bbs",
    "ansi",
    "pc-ansi",
    "pcansi",
    "scoansi",
    "netrunner",
    "ansi-256color",
]

[acs]
sysop = "s255"
cosysop = "s250"

[logon]
matrix = true
ask_apply = true
tries = 5
system_password = "SYSTEM"
system_password_acs = "s250"
start_menu = "STARTUP"
real_names = false
time_per_call = false
last_callers = 10
calls_birth = 10
calls_phone = 5

[newuser]
password = ""
verify = true
alias_format = 2
page_length = 24
ask_page_length = true
hot_keys = true
ask_hot_keys = true
expert = false
ask_expert = true
pause = true
ask_pause = true
quote = true
ask_quote = true
yes_no_bars = true
ask_yes_no_bars = true
config = true
ask_real_name = true
ask_birth_date = true
ask_phone = true
ask_address = true
ask_location = true
ask_sex = true

[prompts]
yes = "|U5[|U6Y|U5/|U4n|U5] |U6"
no = "|U5[|U4y|U5/|U6N|U5] |U6"
yes_word = "Yes"
no_word = "No"
yes_bar = "|U8 Yes |U7 No "
no_bar = "|U7 Yes |U8 No |U1"
password_echo = "■"
remove_pause = true
light = "■"
light_ok = "√"
light_fail = "x"

[messages]
acs_post_email = "s25"
acs_anonymous = "s50"
acs_anon_automsg = "s50"
acs_autosig = "s25"
abort_mandatory_ok = false
ask_private = true
ask_private_reply = true
ask_post_after_read = true
ask_delete_replied = true
ask_delete_all_read = true
ask_auto_quote = true
default_quote_lines = true
max_quote_lines = 11
mandatory_all_confs = true
compress_area_numbers = true
ansi_quote = "(ansi codes detected; line not displayed)"
acs_attach_public = "s50"
acs_attach_email = "s50"
acs_upload_message = "s25"
ask_upload_reply = false
ask_upload_email = true
# Boards callers create and moderate (new): who may (blank: nobody), the
# area they go under, how many each, and when an empty one is removed.
board_create_acs = ""
board_folder = ""
boards_per_caller = 1
board_empty_days = 30

[files]
use_file_points = false
kb_per_point = 15
upload_points_percent = 175
use_daily_limit = true
use_daily_kb_limit = true
use_ratio = false
use_kb_ratio = false
auto_validate = true
allow_blind_upload = true
upload_dupe_check = 4
import_descriptions = true
description_files = [
    "FILE_ID.DIZ",
    "DESC.SDI",
]
max_import_lines = 0
no_description = "No description"
wrap_descriptions = true
advance_bar_on_flag = true
max_upload_bytes = 104857600
transfer_cps = 500000
ask_auto_logoff = true
auto_logoff_seconds = 10
test_command = ""
test_success_code = 0
age_limit_years = 0
strict_age = false
delete_list = ""
archive_comment = ""

# Paging the SysOp (CP): the hours a SysOp who's online can be paged
# (equal times = always), who may page outside them and with what
# password, pages per call, how many five-second rounds a page lasts.
[chat]
start = "11:00"
end = "20:00"
override_acs = "s150"
override_password = ""
max_page_times = 3
page_beeps = 6
restore_time = true
ask_email = true

# QWK offline mail: packets are PACKET.QWK, replies PACKET.REP; the
# screens come from the text directory.
[qwk]
packet = "INIQUITY"
welcome = "WELCOME.ANS"
news = "NEWS.ANS"
goodbye = "LOGOFF.ANS"
strip_sigs = true

# DOS doors: a door command naming a .BAT, .COM or .EXE runs in the
# built-in DOS machine, which has a FOSSIL and a COM1 wired to the
# caller: drop the door's files in a directory under `drive` (C:, on the
# PATH) and point a menu command at its batch file. The node's drop
# directory is D: and the current drive. For a door the built-in machine
# can't run, `emulator` names a DOSBox command (%C is the config written
# for each door; e.g. "dosbox-staging -noprimaryconf -nolocalconf -conf
# %C"); then `setup` runs before each door (e.g. a FOSSIL driver) and
# `config` adds dosbox.conf lines (e.g. "[cpu]", "cycles=max").
[dos]
emulator = ""
drive = "doors/dos"
setup = []
config = []
# Doors only one caller may be in at a time (a single-player game, or an
# unregistered one that runs on one node).
one_at_a_time = []

